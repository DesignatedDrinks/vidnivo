name: Verify mobile editor
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: Timeline unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist-ios

  swift-syntax:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift native exporter syntax validation
        run: xcrun swiftc -frontend -parse modules/vidnivo-export/ios/VidnivoExportModule.swift
