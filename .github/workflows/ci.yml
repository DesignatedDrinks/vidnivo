name: Verify mobile editor
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: Timeline unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist-ios

  swift-syntax:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift native exporter syntax validation
        run: xcrun swiftc -frontend -parse modules/vidnivo-export/ios/VidnivoExportModule.swift

  android-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload Android installable APK
        uses: actions/upload-artifact@v4
        with:
          name: vidnivo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-native-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS native project
        run: CI=1 npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build iOS simulator app without signing
        run: xcodebuild -workspace ios/VIDNIVO.xcworkspace -scheme VIDNIVO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/vidnivo-build" CODE_SIGNING_ALLOWED=NO build -quiet
