name: Mobile editor browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/rollblink-editor-shell.css'
      - 'docs/rollblink-mobile-shell.js'
      - 'docs/rollblink-mobile-timeline.js'
      - 'tests/mobile-ui.smoke.mjs'
      - '.github/workflows/mobile-ui.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/rollblink-editor-shell.css'
      - 'docs/rollblink-mobile-shell.js'
      - 'docs/rollblink-mobile-timeline.js'
      - 'tests/mobile-ui.smoke.mjs'
      - '.github/workflows/mobile-ui.yml'
  workflow_dispatch:
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Install FFmpeg for media integration test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate real video and audio fixture
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=360x640:rate=20 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -c:v libvpx -deadline realtime -cpu-used 8 -b:v 600k -c:a libvorbis -shortest /tmp/rollblink-smoke.webm
      - name: Mobile editor Chromium smoke
        run: node tests/mobile-ui.smoke.mjs
      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollblink-mobile-editor-screenshot
          path: /tmp/rollblink-*-smoke.png
          if-no-files-found: ignore
