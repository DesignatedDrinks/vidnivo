name: Deploy ROLLBLINK Studio Web
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/rollblink-editor-shell.css'
      - 'docs/rollblink-mobile-shell.js'
      - 'docs/rollblink-mobile-timeline.js'
      - 'docs/rollblink-creator-kit.js'
      - 'docs/rollblink-filters.js'
      - 'docs/rollblink-face-retouch.js'
      - 'docs/rollblink-export-sync.js'
      - 'docs/rollblink-caption-touch.js'
      - 'docs/rollblink-autopilot.js'
      - 'docs/rollblink-branding.js'
      - 'docs/rollblink-mark.svg'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rollblink-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ROLLBLINK
        uses: actions/checkout@v4
      - name: Validate standalone editor
        run: |
          test -s docs/index.html
          grep -q 'class="viewer"' docs/index.html
          grep -q 'startExport()' docs/index.html
          grep -q 'MediaRecorder' docs/index.html
      - name: Validate browser editor and Safari shader
        run: node --test tests/web-studio.test.mjs tests/web-face-retouch.test.mjs tests/web-export-sync.test.mjs tests/web-caption-touch.test.mjs tests/web-creator-autopilot.test.mjs tests/web-brand-motion.test.mjs tests/web-editorial-ui.test.mjs tests/rollblink-brand.test.mjs
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload ROLLBLINK Studio
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published editor and assets over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "${SITE}?revision=${GITHUB_SHA}" -o /tmp/rollblink-live.html &&
               grep -q 'rollblink-editor-shell.css?v=20261012-mobilefirst' /tmp/rollblink-live.html &&
               curl -fsSL --max-time 20 "${SITE}rollblink-editor-shell.css?revision=${GITHUB_SHA}" -o /tmp/rollblink-live.css &&
               grep -q -- '--rb-bg:#07090D' /tmp/rollblink-live.css &&
               curl -fsSL --max-time 20 "${SITE}rollblink-mobile-shell.js?revision=${GITHUB_SHA}" -o /tmp/rollblink-live-shell.js &&
               grep -q 'prepareWaveform' /tmp/rollblink-live-shell.js; then
              echo "Verified live mobile editor: ${SITE}"
              exit 0
            fi
            echo "Waiting for Pages CDN to serve current assets (attempt ${attempt}/12)"
            sleep 6
          done
          echo 'Deployment reported success but live mobile-first assets could not be verified.'
          exit 1
