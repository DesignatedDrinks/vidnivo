name: Deploy ROLLBLINK Studio Web
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/rollblink-filters.js'
      - 'docs/rollblink-face-retouch.js'
      - 'docs/rollblink-export-sync.js'
      - 'docs/rollblink-caption-touch.js'
      - 'docs/rollblink-autopilot.js'
      - 'docs/rollblink-branding.js'
      - 'docs/rollblink-mark.svg'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rollblink-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ROLLBLINK
        uses: actions/checkout@v4
      - name: Validate standalone editor
        run: |
          test -s docs/index.html
          grep -q 'class="stage-top"' docs/index.html
          grep -q 'startExport()' docs/index.html
          grep -q 'MediaRecorder' docs/index.html
      - name: Validate browser editor and Safari shader
        run: node --test tests/web-studio.test.mjs tests/web-face-retouch.test.mjs tests/web-export-sync.test.mjs tests/web-caption-touch.test.mjs tests/web-creator-autopilot.test.mjs tests/web-brand-motion.test.mjs tests/web-editorial-ui.test.mjs
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload ROLLBLINK Studio
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
