name: Verify VIDNIVO Web Studio
on:
  pull_request:
    paths:
      - 'index.html'
      - 'docs/index.html'
      - 'vidnivo-filters.js'
      - 'docs/vidnivo-filters.js'
      - 'tests/web-studio.test.mjs'
      - '.github/workflows/verify-web-studio.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/index.html'
      - 'vidnivo-filters.js'
      - 'docs/vidnivo-filters.js'
      - 'tests/web-studio.test.mjs'
      - '.github/workflows/verify-web-studio.yml'
jobs:
  browser-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real browser editor, subtitle mapping and Safari filters
        run: node --test tests/web-studio.test.mjs
